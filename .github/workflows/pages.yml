# Publishes site/ to GitHub Pages.
#
# site/ is used rather than docs/ because docs/ already holds the project's
# data documentation. Pages cannot serve an arbitrary folder from a branch, so
# the folder is uploaded as an artifact by this workflow instead.
name: Deploy site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # enablement:true turns Pages on for the repo the first time this runs,
      # using the workflow's own pages:write token. Without it the action only
      # reads existing Pages config and fails with 404 on a repo that has
      # never had Pages enabled.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
