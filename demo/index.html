<title>Groove</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  color-scheme: light;

  --paper:    #FAFAFA;
  --panel:    #FFFFFF;
  --sunk:     rgba(18, 18, 18, 0.04);
  --ink:      #121212;
  --ink-2:    rgba(18, 18, 18, 0.76);
  --ink-3:    rgba(18, 18, 18, 0.65);
  --rule:     rgba(18, 18, 18, 0.25);
  --rule-2:   rgba(18, 18, 18, 0.40);

  /* selection / interaction accent */
  --pick:     #121212;
  --pick-soft: rgba(18, 18, 18, 0.08);
  --pick-sunk: rgba(18, 18, 18, 0.06);
  --pick-ink: #FFFFFF;

  /* status dot */
  --dot:      #54BB6D;

  /* half-life ramp: pale = unstable, deep = holds */
  --h0: #E8F0F2;
  --h1: #A0C8D4;
  --h2: #5A9EB2;
  --h3: #2A78A0;
  --h4: #134B66;

  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --ui:   var(--mono);
  --seq:  var(--mono);

  --ease: cubic-bezier(.23, 1, .32, 1);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper:  #0A0A0A;
    --panel:  #141414;
    --sunk:   rgba(255, 255, 255, 0.05);
    --ink:    #E8E8E8;
    --ink-2:  rgba(255, 255, 255, 0.72);
    --ink-3:  rgba(255, 255, 255, 0.50);
    --rule:   rgba(255, 255, 255, 0.18);
    --rule-2: rgba(255, 255, 255, 0.30);
    --pick:     #E8E8E8;
    --pick-soft: rgba(255, 255, 255, 0.08);
    --pick-sunk: rgba(255, 255, 255, 0.06);
    --pick-ink: #0A0A0A;
    --dot:      #54BB6D;
    --h0: #15252C;
    --h1: #1C4E62;
    --h2: #358CA8;
    --h3: #62BDD6;
    --h4: #A6DCEC;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper:  #0A0A0A;
  --panel:  #141414;
  --sunk:   rgba(255, 255, 255, 0.05);
  --ink:    #E8E8E8;
  --ink-2:  rgba(255, 255, 255, 0.72);
  --ink-3:  rgba(255, 255, 255, 0.50);
  --rule:   rgba(255, 255, 255, 0.18);
  --rule-2: rgba(255, 255, 255, 0.30);
  --pick:     #E8E8E8;
  --pick-soft: rgba(255, 255, 255, 0.08);
  --pick-sunk: rgba(255, 255, 255, 0.06);
  --pick-ink: #0A0A0A;
  --dot:      #54BB6D;
  --h0: #15252C;
  --h1: #1C4E62;
  --h2: #358CA8;
  --h3: #62BDD6;
  --h4: #A6DCEC;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
}

.shell {
  max-width: 1600px;
  margin: 0 auto;
  padding-left: 40px;
  padding-right: 40px;
  padding-block: 0 36px;
}

/* ---------------- masthead ---------------- */

.masthead {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px 32px;
  padding-block: 28px 20px;
}
.masthead h1 {
  font-size: 25px;
  line-height: 1.15;
  letter-spacing: .01em;
  font-weight: 600;
  text-transform: uppercase;
  margin: 0;
  max-width: 40ch;
}
.standfirst {
  margin: 6px 0 0;
  color: var(--ink-3);
  max-width: 64ch;
  font-size: 12px;
  line-height: 1.6;
}
.masthead-side {
  display: flex;
  align-items: center;
  gap: 8px;
}

.ghost {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-2);
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 7px 16px;
  min-height: 32px;
  cursor: pointer;
  transition: border-color .25s var(--ease), color .25s var(--ease), background .25s var(--ease);
}
.ghost:hover { border-color: var(--rule-2); color: var(--ink); background: var(--sunk); }
.ghost:active { transform: scale(.97); }

/* ---------------- the three tiers ---------------- */

.tiers {
  display: grid;
  grid-template-columns: 310px minmax(0, 1fr) minmax(0, 1.4fr);
  grid-template-rows: minmax(580px, calc(100vh - 180px));
  gap: 0;
  margin-top: 20px;
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 6px;
  overflow: hidden;
}
.tier {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border-right: 1px solid var(--rule);
}
.tier:last-child { border-right: 0; }

.tier-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--rule);
  background: var(--sunk);
  position: sticky;
  top: 0;
  z-index: 1;
}
.tier-top h2 {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .09em;
  text-transform: uppercase;
  margin: 0;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 7px;
}
.tier-top h2::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--dot);
  flex: 0 0 auto;
}
.tally {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.sieve {
  margin: 10px 16px 4px;
  width: calc(100% - 32px);
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 8px 10px;
  min-height: 34px;
  transition: border-color .25s var(--ease), background .25s var(--ease);
}
.sieve::placeholder { color: var(--ink-3); opacity: .7; }
.sieve:focus {
  border-color: var(--pick);
  background: var(--panel);
  outline: none;
}

.scroller {
  flex: 1;
  overflow-y: auto;
  padding: 7px;
  min-height: 0;
  scroll-behavior: smooth;
}
.scroller::-webkit-scrollbar { width: 4px; }
.scroller::-webkit-scrollbar-track { background: transparent; }
.scroller::-webkit-scrollbar-thumb { background: var(--rule-2); border-radius: 2px; }

/* ---------------- tier 1: alleles ---------------- */

.allele {
  width: 100%;
  display: block;
  text-align: left;
  background: none;
  border: 0;
  border-left: 3px solid transparent;
  border-radius: 6px;
  padding: 10px 10px;
  margin-bottom: 2px;
  cursor: pointer;
  font-family: var(--mono);
  color: var(--ink);
  position: relative;
  transition: background .22s var(--ease), transform .18s var(--ease);
}
.allele:hover { background: var(--sunk); }
.allele:active { transform: scale(.985); }
.allele[aria-pressed="true"] {
  background: var(--pick-sunk);
  border-left-color: var(--pick);
  animation: fadeSelect .32s var(--ease);
}
.allele-name {
  font-family: var(--mono);
  font-size: 12.5px;
  font-weight: 500;
  display: block;
}
.allele-sub {
  font-size: 10.5px;
  color: var(--ink-3);
  display: block;
  margin-top: 2px;
}

/* distribution strip */
.strip {
  display: flex;
  gap: 1px;
  margin-top: 6px;
  height: 3px;
  border-radius: 1.5px;
  overflow: hidden;
}
.strip i {
  flex: 1;
  display: block;
  transition: opacity .3s var(--ease);
}

/* ---------------- tier 2: ranked peptides ---------------- */

.rank {
  width: 100%;
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  text-align: left;
  background: none;
  border: 0;
  border-left: 3px solid transparent;
  border-radius: 6px;
  padding: 8px 10px;
  margin-bottom: 2px;
  cursor: pointer;
  font-family: var(--mono);
  color: var(--ink);
  transition: background .22s var(--ease), transform .18s var(--ease);
}
.rank:hover { background: var(--sunk); }
.rank:active { transform: scale(.992); }
.rank[aria-pressed="true"] {
  background: var(--pick-sunk);
  border-left-color: var(--pick);
  animation: fadeSelect .32s var(--ease);
}
.rank-ord {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  text-align: right;
}
.rank-body { min-width: 0; }
.rank-seq {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: .1em;
  display: block;
}
.bar {
  height: 4px;
  border-radius: 2px;
  margin-top: 5px;
  background: var(--h2);
  min-width: 2px;
  transition: width .4s var(--ease), background .3s var(--ease);
}
.rank-val {
  font-family: var(--mono);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  color: var(--ink-2);
}
.solved {
  display: inline-block;
  vertical-align: 1px;
  margin-left: 6px;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--dot);
}

/* ---------------- tier 3: structure ---------------- */

.stage {
  position: relative;
  flex: 1;
  min-height: 300px;
  background: var(--sunk);
  touch-action: none;
  cursor: grab;
  transition: background .3s var(--ease);
}
.stage:active { cursor: grabbing; }
.stage #viewport {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  animation: canvasFade .8s var(--ease) .15s forwards;
}
.stage .no-struct {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 11px;
  color: var(--ink-3);
  padding: 20px;
}

.stage-caption {
  position: absolute;
  left: 16px; bottom: 14px; right: 16px;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 10px;
  pointer-events: none;
}
.stage-caption b {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: .1em;
  color: var(--ink);
}
.stage-caption span { font-size: 10.5px; color: var(--ink-3); letter-spacing: .01em; }

.readouts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
  border-top: 1px solid var(--rule);
  background: var(--sunk);
}
.readouts > div {
  padding: 10px 14px;
  border-right: 1px solid var(--rule);
  min-width: 0;
}
.readouts > div:last-child { border-right: 0; }
.readouts dt {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 0;
}
.readouts dd {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  margin: 3px 0 0;
}

.stub {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 24px;
  text-align: center;
  color: var(--ink-3);
  font-size: 12px;
  letter-spacing: .06em;
}

/* ---------------- footnote ---------------- */

.footnote {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--rule);
  display: flex;
  flex-wrap: wrap;
  gap: 8px 28px;
  align-items: baseline;
  font-size: 10.5px;
  color: var(--ink-3);
  line-height: 1.6;
}
.footnote p { margin: 0; max-width: 72ch; }
.footnote a {
  color: var(--ink);
  text-decoration: none;
  transition: color .2s var(--ease);
}
.footnote a:hover { text-decoration: underline; }
.footnote code {
  font-family: var(--mono);
  font-size: 10px;
  background: var(--sunk);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 2px 6px;
  color: var(--ink-2);
}

.legend {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10.5px;
  color: var(--ink-3);
}
.ramp {
  display: flex;
  width: 72px;
  height: 4px;
  border-radius: 2px;
  overflow: hidden;
}
.ramp i { flex: 1; }

/* ---------------- animations ---------------- */

@keyframes fadeSelect {
  0%   { opacity: .55; transform: scale(.995); }
  100% { opacity: 1;   transform: scale(1); }
}
@keyframes slideIn {
  0%   { transform: scaleY(0); opacity: 0; }
  60%  { transform: scaleY(1.05); opacity: .9; }
  100% { transform: scaleY(1); opacity: 1; }
}
@keyframes canvasFade {
  0%   { opacity: 0; transform: scale(.98); }
  100% { opacity: 1; transform: scale(1); }
}

/* ---------------- responsive ---------------- */

@media (max-width: 1080px) {
  .tiers { grid-template-columns: 260px minmax(0, 1fr); }
  .tier-structure {
    grid-column: 1 / -1;
    border-top: 1px solid var(--rule);
    border-right: 0;
  }
  .shell { padding-left: 24px; padding-right: 24px; }
}
@media (max-width: 680px) {
  .tiers {
    grid-template-columns: 1fr;
    min-height: 0;
  }
  .tier { border-right: 0; border-bottom: 1px solid var(--rule); }
  .tier:last-child { border-bottom: 0; }
  .tier-alleles .scroller { max-height: 232px; }
  .tier-peptides .scroller { max-height: 300px; }
  .stage { min-height: 320px; }
  .masthead { padding-block: 20px 14px; }
  .shell { padding-left: 16px; padding-right: 16px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    transition-duration: .001ms !important;
  }
  .stage #viewport { opacity: 1; animation: none; }
}
</style>

<div class="shell">

  <header class="masthead">
    <div>
      <h1>pMHC-I Stability Explorer</h1>
      <p class="standfirst">
        Every measured peptide for 75 HLA-I alleles, ranked by dissociation half-life, with the groove that holds it.
      </p>
    </div>
    <div class="masthead-side">
      <button class="ghost" id="theme" type="button" aria-pressed="false">Dark</button>
    </div>
  </header>

  <div class="tiers">

    <section class="tier tier-alleles" aria-label="Alleles">
      <div class="tier-top">
        <h2>Alleles</h2>
        <span class="tally" id="tally-allele"></span>
      </div>
      <input class="sieve" id="sieve-allele" type="search" placeholder="Find an allele" aria-label="Find an allele">
      <div class="scroller" id="list-allele"></div>
    </section>

    <section class="tier tier-peptides" aria-label="Peptides">
      <div class="tier-top">
        <h2 id="pep-heading">Peptides</h2>
        <span class="tally" id="tally-pep"></span>
      </div>
      <input class="sieve" id="sieve-pep" type="search" placeholder="Find a peptide" aria-label="Find a peptide">
      <div class="scroller" id="list-pep"></div>
    </section>

    <section class="tier tier-structure" aria-label="Structure">
      <div class="tier-top">
        <h2>Structure</h2>
        <span class="tally" id="tally-struct"></span>
      </div>
      <div class="stage" id="stage">
        <div id="viewport"></div>
        <div id="no-struct" class="no-struct" hidden>Select a peptide with a structure</div>
        <div class="stage-caption">
          <b id="cap-seq"></b>
          <span id="cap-note">Drag to rotate</span>
        </div>
      </div>
      <dl class="readouts" id="readouts"></dl>
    </section>

  </div>

  <div class="footnote">
    <div class="legend">
      <span>Half-life</span>
      <span class="ramp" aria-hidden="true"><i style="background:var(--h0)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i></span>
      <span>short to long</span>
    </div>
    <p id="provenance"></p>
  </div>

</div>

<script src="3Dmol-min.js"></script>
<script src="structures_pdb.js"></script>
<script src="payload.js"></script>
<script>
/* =========================================================================
   Groove - three-tier dashboard
   Tier 1 allele  ->  Tier 2 peptides ranked by half-life  ->  Tier 3 structure

   The structure tier uses 3Dmol.js to render molecular structures.
   It loads bundled PDB structures for known complexes, or converts
   Boltz-2 Cα traces from the payload into PDB format for rendering.
   ========================================================================= */
(function () {
  'use strict';

  var D = window.__DATA__;
  if (!D) return;

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  /* ---- half-life scale -------------------------------------------------
     Half-lives span minutes to days, so rank on log1p and bucket into the
     five ramp stops. Scale is per allele: the question is which peptides
     THIS allele holds longest. */
  var RAMP = ['--h0', '--h1', '--h2', '--h3', '--h4'];
  function norm(t, max) {
    if (t == null || max == null || max <= 0) return 0;
    return Math.min(1, Math.log1p(Math.max(t, 0)) / Math.log1p(max));
  }
  function rampVar(f) {
    return RAMP[Math.min(RAMP.length - 1, Math.max(0, Math.round(f * (RAMP.length - 1))))];
  }
  function hours(t) {
    if (t == null) return 'n/a';
    if (t === 0) return '0 h';
    if (t < 1) return (t * 60).toFixed(0) + ' min';
    return (t >= 10 ? t.toFixed(0) : t.toFixed(1)) + ' h';
  }

  /* =======================================================================
     Viewer3D - 3Dmol.js viewer wrapper
     ===================================================================== */
  var viewer3d = null;
  var viewerReady = false;
  var ROLECOL = { peptide: '#f72585', heavy: '#4895ef', b2m: '#80b918' };
  var PDB_STRUCTS = window.__PDB_STRUCTURES__ || {};

  function initViewer() {
    var el = $('viewport');
    if (!el || !window.$3Dmol) return;
    var isDark = getComputedStyle(document.documentElement)
                   .getPropertyValue('color-scheme').trim() === 'dark' ||
                 document.documentElement.getAttribute('data-theme') === 'dark';
    viewer3d = $3Dmol.createViewer(el, {
      backgroundColor: isDark ? '#0A0A0A' : '#FAFAFA'
    });
    viewerReady = true;
    window.addEventListener('resize', function () { if (viewer3d) viewer3d.resize(); });
    if (window.ResizeObserver) {
      new ResizeObserver(function () { if (viewer3d) viewer3d.resize(); }).observe(el);
    }
  }

  function updateViewerBg() {
    if (!viewer3d) return;
    var isDark = getComputedStyle(document.documentElement)
                   .getPropertyValue('color-scheme').trim() === 'dark' ||
                 document.documentElement.getAttribute('data-theme') === 'dark';
    viewer3d.setBackgroundColor(isDark ? '#0A0A0A' : '#FAFAFA');
    viewer3d.render();
  }

  /* Convert Boltz-2 Cα trace (payload format) to PDB text for 3Dmol */
  function caToPDB(atoms) {
    var lines = [];
    var AA1TO3 = { A:'ALA',R:'ARG',N:'ASN',D:'ASP',C:'CYS',Q:'GLN',E:'GLU',
                   G:'GLY',H:'HIS',I:'ILE',L:'LEU',K:'LYS',M:'MET',F:'PHE',
                   P:'PRO',S:'SER',T:'THR',W:'TRP',Y:'TYR',V:'VAL' };
    atoms.forEach(function (a, i) {
      var resn = AA1TO3[a.el] || 'ALA';
      var chain = a.chain === 'H' ? 'A' : a.chain === 'B' ? 'B' : 'C';
      var line = 'ATOM  ' +
        String(i + 1).padStart(5) + '  CA  ' +
        resn + ' ' + chain +
        String(a.resi).padStart(4) + '    ' +
        a.x.toFixed(3).padStart(8) +
        a.y.toFixed(3).padStart(8) +
        a.z.toFixed(3).padStart(8) +
        '  1.00  0.00           C';
      lines.push(line);
    });
    lines.push('END');
    return lines.join('\n');
  }

  /* Load a structure into the viewer with role-based colouring */
  function loadIntoViewer(pdbText, fmt, pepColor) {
    if (!viewer3d) return;
    viewer3d.clear();
    var model = viewer3d.addModel(pdbText, fmt || 'pdb');
    var allAtoms = model.selectedAtoms({});

    /* Detect chains and roles */
    var chainLens = {};
    allAtoms.forEach(function (a) {
      if (!a.hetflag) chainLens[a.chain] = (chainLens[a.chain] || 0) + 1;
    });
    var chainIds = Object.keys(chainLens);
    var roles = {};
    chainIds.forEach(function (c) {
      var n = chainLens[c];
      if (n >= 7 && n <= 25) roles[c] = 'peptide';
      else if (n >= 85 && n <= 120) roles[c] = 'b2m';
      else if (n >= 200) roles[c] = 'heavy';
      else roles[c] = 'heavy';
    });

    /* Style by role */
    viewer3d.setStyle({}, {});
    chainIds.forEach(function (c) {
      var col = ROLECOL[roles[c]] || '#64748b';
      viewer3d.setStyle(
        { chain: c, hetflag: false },
        { cartoon: { color: col, thickness: 0.3, arrows: true } }
      );
    });

    /* Peptide as sticks + labels */
    var pepChains = chainIds.filter(function (c) { return roles[c] === 'peptide'; });
    pepChains.forEach(function (pc) {
      var stickCol = pepColor || ROLECOL.peptide;
      viewer3d.addStyle(
        { chain: pc },
        { stick: { radius: 0.2, color: stickCol } }
      );
    });

    /* Hide waters and common ligands */
    viewer3d.setStyle(
      { resn: ['HOH','DOD','SO4','PO4','GOL','EDO','CL','NA','MG'] },
      {}
    );

    /* Zoom to groove region */
    var heavyChains = chainIds.filter(function (c) { return roles[c] === 'heavy'; });
    var zoomSel = heavyChains.concat(pepChains);
    if (zoomSel.length) viewer3d.zoomTo({ chain: zoomSel });

    viewer3d.spin('y');
    viewer3d.render();
  }

  /* =======================================================================
     State and rendering
     ===================================================================== */
  var byAllele = {};
  D.alleles.forEach(function (a) { byAllele[a.allele] = a; });
  var solvedFor = {};
  (D.overlap || []).forEach(function (o) {
    solvedFor[o.allele + '|' + o.peptide] = o;
  });

  var state = { allele: null, peptide: null };

  /* ---- tier 1 ---- */
  function paintAlleles() {
    var q = $('sieve-allele').value.trim().toUpperCase();
    var items = D.alleles.filter(function (a) {
      return !q || a.allele.toUpperCase().indexOf(q) >= 0;
    });
    $('tally-allele').textContent = items.length + '/' + D.alleles.length;

    var box = $('list-allele');
    box.innerHTML = '';
    items.forEach(function (a) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'allele';
      b.setAttribute('aria-pressed', String(a.allele === state.allele));

      var strip = a.peptides.slice(0, 10).map(function (p) {
        return '<i style="background:var(' + rampVar(norm(p.t, a.thalf_max)) + ')"></i>';
      }).join('');

      b.innerHTML =
        '<span class="allele-name">' + esc(a.allele) + '</span>' +
        '<span class="allele-sub">' + a.n_pairs.toLocaleString() + ' peptides, longest ' +
          hours(a.thalf_max) + '</span>' +
        '<span class="strip">' + strip + '</span>';
      b.addEventListener('click', function () { pickAllele(a.allele); });
      box.appendChild(b);
    });
  }

  /* ---- tier 2 ---- */
  function paintPeptides() {
    var a = byAllele[state.allele];
    var box = $('list-pep');
    if (!a) { box.innerHTML = ''; return; }

    var q = $('sieve-pep').value.trim().toUpperCase();
    var items = a.peptides.filter(function (p) {
      return !q || p.p.toUpperCase().indexOf(q) >= 0;
    });

    $('pep-heading').textContent = 'Peptides in ' + a.allele;
    $('tally-pep').textContent = items.length + ' of ' + a.n_pairs.toLocaleString();

    box.innerHTML = '';
    items.forEach(function (p, i) {
      var f = norm(p.t, a.thalf_max);
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'rank';
      b.setAttribute('aria-pressed', String(p.p === state.peptide));
      b.innerHTML =
        '<span class="rank-ord">' + (i + 1) + '</span>' +
        '<span class="rank-body">' +
          '<span class="rank-seq">' + esc(p.p) +
            (structures[structureKey(a.allele, p.p)]
              ? '<span class="solved" title="Boltz-2 structure available"></span>'
              : p.s ? '<span class="solved" title="Solved structure in the PDB"></span>' : '') +
          '</span>' +
          '<span class="bar" style="width:' + Math.max(3, f * 100) + '%;background:var(' +
            rampVar(f) + ')"></span>' +
        '</span>' +
        '<span class="rank-val">' + hours(p.t) + '</span>';
      b.addEventListener('click', function () { pickPeptide(p.p); });
      box.appendChild(b);
    });
  }

  /* ---- tier 3 ---- */

  /* Boltz-2 structure lookup. complex_id format: A0101_PEPTIDE */
  var structures = D.structures || {};
  function structureKey(allele, peptide) {
    return allele.replace('HLA-', '').replace(/\*/g, '').replace(/:/g, '') + '_' + peptide;
  }

  function paintStructure() {
    var a = byAllele[state.allele];
    if (!a || !state.peptide) return;

    var pep = null;
    a.peptides.some(function (p) { if (p.p === state.peptide) { pep = p; return true; } });
    var hit = solvedFor[a.allele + '|' + state.peptide] || null;
    var tpl = a.tpl;

    var pepCol = css(rampVar(norm(pep && pep.t, a.thalf_max)));

    /* Priority: 1) Bundled PDB matching this exact pair
                 2) Boltz-2 Cα trace from payload
                 3) Bundled PDB template for the allele
                 4) No-structure placeholder */
    var skey = structureKey(a.allele, state.peptide);
    var boltzAtoms = structures[skey];
    var hasBoltz = boltzAtoms && boltzAtoms.length > 0;

    /* Map solved-pair PDB IDs to bundled structures */
    var bundledPdb = null;
    if (hit && hit.pdbs) {
      hit.pdbs.some(function (id) {
        if (PDB_STRUCTS[id.toUpperCase()]) { bundledPdb = id.toUpperCase(); return true; }
      });
    }
    /* Fallback: use 1HHK as template for A*02:01 pairs */
    var templatePdb = (!bundledPdb && !hasBoltz && a.allele === 'HLA-A*02:01' && PDB_STRUCTS['1HHK']) ? '1HHK' : null;

    $('no-struct').hidden = true;
    if (bundledPdb) {
      loadIntoViewer(PDB_STRUCTS[bundledPdb].pdb, 'pdb', pepCol);
    } else if (hasBoltz) {
      loadIntoViewer(caToPDB(boltzAtoms), 'pdb', pepCol);
    } else if (templatePdb) {
      loadIntoViewer(PDB_STRUCTS[templatePdb].pdb, 'pdb', pepCol);
    } else if (viewer3d) {
      viewer3d.clear(); viewer3d.render();
      $('no-struct').hidden = false;
    }

    $('cap-seq').textContent = state.peptide;
    $('cap-note').textContent = bundledPdb
      ? 'Crystal structure ' + bundledPdb + ' · drag to rotate'
      : hasBoltz
        ? 'Boltz-2 prediction · Cα trace · drag to rotate'
        : templatePdb
          ? 'Template ' + templatePdb + ' · drag to rotate'
          : hit
            ? 'Solved as ' + hit.pdbs[0] + ' (no 3D loaded)'
            : 'No structure available';
    $('tally-struct').textContent = bundledPdb ? 'crystal structure'
      : hasBoltz ? 'Boltz-2 fold'
      : templatePdb ? 'allele template'
      : (hit ? 'solved complex' : 'no structure');

    var pdb = hit ? hit.pdbs[0] : (tpl ? tpl.pdb : null);
    var res = hit ? hit.res : (tpl ? tpl.res : null);
    var year = hit ? hit.year : (tpl ? tpl.year : null);

    var cells = [
      ['Half-life', pep ? hours(pep.t) : 'n/a'],
      ['Source', bundledPdb || (hasBoltz ? 'Boltz-2' : (pdb || 'none'))],
      ['Resolution', bundledPdb ? (PDB_STRUCTS[bundledPdb].title.match(/[\d.]+\s*Å/) || ['n/a'])[0] : (hasBoltz ? 'predicted' : (res != null ? res + ' Å' : 'n/a'))],
      ['Chains', (bundledPdb || hasBoltz) ? 'H + β₂m + pep' : (year || 'n/a')]
    ];
    $('readouts').innerHTML = cells.map(function (c) {
      return '<div><dt>' + c[0] + '</dt><dd>' + esc(c[1]) + '</dd></div>';
    }).join('');

    var link = hit ? hit.link : (tpl ? tpl.link : null);
    $('provenance').innerHTML = bundledPdb
      ? 'Experimental crystal structure from RCSB PDB.' +
        ' <a href="https://www.rcsb.org/structure/' + esc(bundledPdb) + '" target="_blank" rel="noopener">Open ' +
        esc(bundledPdb) + ' on RCSB →</a>'
      : hasBoltz
        ? 'Boltz-2 ectodomain fold (3-chain: HLA α + β₂m + peptide). Cα backbone trace, centred on the peptide groove.' +
          (link ? ' <a href="' + esc(link) + '" target="_blank" rel="noopener">Compare with ' +
                  esc(pdb) + ' on RCSB →</a>' : '')
        : templatePdb
          ? 'Allele template from ' + templatePdb + '; not the exact peptide complex.' +
            ' <a href="https://www.rcsb.org/structure/' + esc(templatePdb) + '" target="_blank" rel="noopener">Open on RCSB →</a>'
          : 'No 3D structure loaded.' +
            (Object.keys(structures).length
              ? ' Boltz-2 structures available for ' + Object.keys(structures).length + ' pairs.'
              : '') +
            (link ? ' <a href="' + esc(link) + '" target="_blank" rel="noopener">Open ' +
                    esc(pdb) + ' on RCSB →</a>' : '');
  }

  /* ---- selection ---- */
  function pickAllele(name) {
    state.allele = name;
    var a = byAllele[name];
    state.peptide = a && a.peptides.length ? a.peptides[0].p : null;
    $('sieve-pep').value = '';
    paintAlleles(); paintPeptides(); paintStructure();
  }
  function pickPeptide(seq) {
    state.peptide = seq;
    paintPeptides(); paintStructure();
  }

  /* ---- wiring ---- */
  $('sieve-allele').addEventListener('input', paintAlleles);
  $('sieve-pep').addEventListener('input', paintPeptides);

  $('theme').addEventListener('click', function () {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
    this.textContent = dark ? 'Dark' : 'Light';
    this.setAttribute('aria-pressed', String(!dark));
    updateViewerBg();
    paintStructure();
  });

  initViewer();

  // open on a pair that has a solved structure, so tier 3 is full at rest
  var first = (D.overlap && D.overlap.length) ? D.overlap[0] : null;
  pickAllele(first ? first.allele : D.alleles[0].allele);
  if (first) pickPeptide(first.peptide);
})();
</script>
